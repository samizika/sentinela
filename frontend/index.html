```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hospitalar</title>
</head>

<body>

    <form class="form_main" onsubmit="login(); return false;">
        <img src="seungmin.png" alt="Logo Hospital Grande Pirarucu">

        <p class="heading">Sistema Hospitalar</p>

        <div class="inputContainer">
            <input
                placeholder="Nome de usuário"
                id="usuario"
                class="inputField"
                type="text"
            >
        </div>

        <div class="inputContainer">
            <input
                placeholder="Senha"
                id="senha"
                class="inputField"
                type="password"
            >
        </div>

        <button type="submit" id="button">Entrar</button>

        <p
            id="erro"
            style="display:none; color:red; text-align:center; margin:8px 0 0;"
        ></p>
    </form>

    <script>
        function login() {
            const usuarioEl = document.getElementById("usuario");
            const senhaEl = document.getElementById("senha");
            const erroEl = document.getElementById("erro");

            const payload = {
                usuario: usuarioEl.value,
                senha: senhaEl.value
            };

            if (!payload.usuario || payload.senha === "") {
                erroEl.style.display = "block";
                erroEl.textContent = "Preencha usuário e senha";
                return;
            }

            fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
                .then(async response => {
                    if (!response.ok) {
                        const txt = await response.text().catch(() => "");
                        throw new Error(
                            `HTTP ${response.status} ${txt}`.trim()
                        );
                    }

                    return response.json();
                })
                .then(data => {
                    if (data.tipo === "triagem") {
                        location.href = "triagem.html";
                    } else if (data.tipo === "medico") {
                        location.href = "medico.html";
                    } else if (data.tipo === "atendimento") {
                        location.href = "atendimento.html";
                    } else {
                        throw new Error("Tipo de usuário desconhecido");
                    }
                })
                .catch(err => {
                    console.error(err);

                    erroEl.style.display = "block";
                    erroEl.textContent = "Usuário ou senha incorretos";
                });
        }
    </script>

</body>

</html>
